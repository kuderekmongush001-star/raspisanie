<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Расписание</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<nav>
    <a href="{{ url_for('schedule.index') }}">Расписание</a>
    <a href="{{ url_for('groups.groups_list') }}">Группы</a>
    <a href="{{ url_for('teachers.teachers_list') }}">Преподаватели</a>
    <a href="{{ url_for('subjects.subjects_list') }}">Дисциплины</a>
    <a href="{{ url_for('schedule.history') }}">История</a>
</nav>

<main>
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <div class="flash {{ category }}">{{ message }}</div>
        {% endfor %}
    {% endwith %}

    {% block content %}{% endblock %}
</main>

<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
