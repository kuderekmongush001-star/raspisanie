{% extends "base.html" %}
{% block content %}
<h2>Дисциплины</h2>

<form method="POST" action="{{ url_for('subjects.subject_add') }}" class="add-form">
    <input type="text" name="name" placeholder="Полное название" required>
    <input type="text" name="short_name" placeholder="Код (ИНФ)">
    <button type="submit">Добавить</button>
</form>

<table>
    <thead>
        <tr><th>Название</th><th>Код</th><th>Преподаватели</th><th>Действия</th></tr>
    </thead>
    <tbody>
        {% for s in subjects %}
        <tr>
            <form method="POST" action="{{ url_for('subjects.subject_edit', subject_id=s.id) }}">
                <td><input type="text" name="name" value="{{ s.name }}"></td>
                <td><input type="text" name="short_name" value="{{ s.short_name or '' }}"></td>
            </form>
                <td>
                    {% for t in s.teachers %}
                        {{ t.short_name or t.name }}{% if not loop.last %}, {% endif %}
                    {% else %}—{% endfor %}
                </td>
                <td>
                    <form method="POST" action="{{ url_for('subjects.subject_edit', subject_id=s.id) }}" style="display:inline">
                        <button type="submit">Сохранить</button>
                    </form>
                    <form method="POST" action="{{ url_for('subjects.subject_delete', subject_id=s.id) }}" style="display:inline">
                        <button type="submit" onclick="return confirm('Удалить?')">Удалить</button>
                    </form>
                </td>
        </tr>
        {% else %}
        <tr><td colspan="4">Дисциплин пока нет</td></tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
